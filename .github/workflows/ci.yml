name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines line (>=22.20, the first 22.x with OpenSSL 3.5;
        # 22.0-22.19 ship OpenSSL 3.0); 26 is current. setup-node resolves the
        # latest release of each, so the live ML-KEM probe tests run rather than skip.
        node: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: node -p "'node ' + process.version + ', openssl ' + process.versions.openssl"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # The build regenerates src/output/viewer-shell.ts; it must match the committed bytes.
      - name: Build leaves the tree clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
